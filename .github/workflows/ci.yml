name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build and test
        run: >-
          xcodebuild test
          -project AI-Spotlight.xcodeproj
          -scheme AI-Spotlight
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
