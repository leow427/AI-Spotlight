<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="leaf-title leaf-desc">
  <title id="leaf-title">Growing leaf thinking indicator</title>
  <desc id="leaf-desc">A green shoot sprouts from the soil, opens a leaf, gently sways, and fades into the next loop.</desc>
  <defs>
    <linearGradient id="leafGreen" x1="0" y1="1" x2="0.85" y2="0">
      <stop offset="0%" stop-color="#278653"/>
      <stop offset="55%" stop-color="#54B964"/>
      <stop offset="100%" stop-color="#94DA6A"/>
    </linearGradient>
  </defs>
  <style>
    .leaf-cycle, .leaf-sway, .stem-grow, .leaf-unfurl, .leaf-tilt {
      animation-duration: 4.8s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.333333, 0, 0.666667, 1);
      transform-origin: 0 0;
    }
    .leaf-cycle { animation-name: appear; }
    .leaf-sway { animation-name: sway; }
    .stem-grow { animation-name: stem; }
    .leaf-unfurl { animation-name: unfurl; }
    .leaf-tilt { animation-name: tilt; }
@keyframes appear {
  0% { opacity: 0; }
  5.5% { opacity: 0; }
  10.5% { opacity: 1; }
  87% { opacity: 1; }
  97.5% { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes sway {
  0% { transform: rotate(0deg); }
  34% { transform: rotate(0deg); }
  49% { transform: rotate(-3.1deg); }
  64% { transform: rotate(2.7deg); }
  78% { transform: rotate(-2deg); }
  89% { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}
@keyframes stem {
  0% { transform: scaleY(0); }
  5.5% { transform: scaleY(0); }
  14% { transform: scaleY(0.18); }
  24% { transform: scaleY(0.73); }
  34% { transform: scaleY(1); }
  86% { transform: scaleY(1); }
  94% { transform: scaleY(0.96); }
  100% { transform: scaleY(0.88); }
}
@keyframes tilt {
  0% { transform: rotate(18deg); }
  14% { transform: rotate(18deg); }
  22% { transform: rotate(12deg); }
  29% { transform: rotate(4deg); }
  37% { transform: rotate(-1.5deg); }
  43% { transform: rotate(0deg); }
  86% { transform: rotate(0deg); }
  100% { transform: rotate(4deg); }
}
@keyframes unfurl {
  0% { transform: scale(0, 0); }
  14% { transform: scale(0, 0); }
  22% { transform: scale(0.16, 0.32); }
  29% { transform: scale(0.58, 0.73); }
  37% { transform: scale(1.045, 1.025); }
  43% { transform: scale(1, 1); }
  86% { transform: scale(1, 1); }
  95% { transform: scale(0.95, 0.97); }
  100% { transform: scale(0.86, 0.9); }
}
@media (prefers-reduced-motion: reduce) {
      .leaf-cycle, .leaf-sway, .stem-grow, .leaf-unfurl, .leaf-tilt {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <g transform="translate(73 119)">
    <g class="leaf-cycle"><g class="leaf-sway"><g class="stem-grow">
      <path d="M 0 0 C -4 -14 -0.5 -29 5 -39" fill="none" stroke="#348958" stroke-width="2.6" stroke-linecap="round"/>
      <g transform="translate(5 -39)"><g class="leaf-tilt"><g class="leaf-unfurl"><path d="M 0 0 C -13 -18 -3 -35 34 -43 C 34 -16 18 6 0 0 Z" fill="url(#leafGreen)"/>
  <path d="M 0 0 C 11 -12 21 -29 34 -43 C 34 -16 18 6 0 0 Z" fill="#278E59" opacity="0.23"/>
  <path d="M 0 -0.3 C 9 -10 19 -26 29 -37" fill="none" stroke="#D1EDAE" stroke-opacity="0.76" stroke-width="1.05" stroke-linecap="round"/>
  <path d="M 10 -13 C 9 -18 9 -21 10 -25" fill="none" stroke="#D1EDAE" stroke-opacity="0.32" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M 18.8 -26 C 22 -26.4 24.5 -27.5 27 -29.5" fill="none" stroke="#D1EDAE" stroke-opacity="0.24" stroke-width="0.7" stroke-linecap="round"/></g></g></g>
    </g></g></g>
  </g>
  <ellipse cx="73" cy="123" rx="25" ry="2.4" fill="var(--soil, #88836C)" opacity="0.07"/>
  <path d="M 48 120 C 59 120 64 117.8 72 117.8 C 81 117.8 85 120 106 120" fill="none" stroke="var(--soil, #88836C)" stroke-opacity="0.6" stroke-width="1.55" stroke-linecap="round"/>
  <path d="M 64 125.6 L 67 125.6 M 89 124.8 L 90.8 124.8" fill="none" stroke="var(--soil, #88836C)" stroke-opacity="0.28" stroke-width="1.2" stroke-linecap="round"/>
</svg>
